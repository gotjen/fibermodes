name: stress

# Slow matrix tests of the solvers (about 3 minutes), marked "stress" and
# skipped by the default test run. Start this workflow by hand from the
# Actions tab after changes to the solvers.
on:
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui,test]"
      - name: Run stress tests
        run: pytest -m stress
